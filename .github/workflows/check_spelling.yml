# URL: https://github.com/marketplace/actions/check-spelling-js-vue-html-markdown-text

# .github/workflows/check_spelling.yml
name: Check Spelling
on:
  pull_request:
  push:
    types: [opened, edited, reopened, synchronize]
    paths:
    - '**.js'
    - '**.vue'
    - '**.txt'
    - '**.html'
    - '**.md'
    - '**.blade.php'
  
jobs:
  spelling:
    name: Set Up Environment
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
      with:
        ref: ${{ github.head_ref }}
    - name: Check Spelling
      uses: UnicornGlobal/spellcheck-github-actions@master
